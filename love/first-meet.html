<script>
  function getTargetDate(){
    return new Date(2026, 7, 21, 0, 0, 0); // 21 Aug 2026
  }

  const target = getTargetDate();

  function pad(n){ return n.toString().padStart(2,'0'); }

  function updateCountdown(){
    const now = new Date();
    let diff = target - now;
    if(diff < 0) diff = 0;

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const mins = Math.floor((diff / (1000*60)) % 60);
    const secs = Math.floor((diff / 1000) % 60);

    document.getElementById('cd-days').textContent = pad(days);
    document.getElementById('cd-hours').textContent = pad(hours);
    document.getElementById('cd-mins').textContent = pad(mins);
    document.getElementById('cd-secs').textContent = pad(secs);
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // Canvas background
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = document.body.scrollHeight;
  }

  function initStars(){
    stars = [];
    const count = Math.floor((canvas.width * canvas.height) / 9000);
    for(let i=0; i<count; i++){
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.3 + 0.3,
        alpha: Math.random() * 0.6 + 0.2,
        speed: Math.random() * 0.4 + 0.05,
        twinkleSpeed: Math.random() * 0.02 + 0.005,
        twinklePhase: Math.random() * Math.PI * 2
      });
    }
  }

  function drawStars(t){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    for(const s of stars){
      const tw = Math.sin(t * s.twinkleSpeed + s.twinklePhase) * 0.3 + 0.7;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = s.r > 1.1 ? `rgba(224,164,88,${(s.alpha*tw).toFixed(3)})` : `rgba(239,234,246,${(s.alpha*tw*0.7).toFixed(3)})`;
      ctx.fill();
    }
  }

  function animate(t){
    drawStars(t || 0);
    requestAnimationFrame(animate);
  }

  resize();
  initStars();
  animate(0);

  window.addEventListener('resize', () => {
    resize();
    initStars();
  });
</script>

<script>
(function(window){

    function random(min, max) {
        return min + Math.floor(Math.random() * (max - min + 1));
    }

    function bezier(cp, t) {
        var p1 = cp[0].mul((1 - t) * (1 - t));
        var p2 = cp[1].mul(2 * t * (1 - t));
        var p3 = cp[2].mul(t * t);
        return p1.add(p2).add(p3);
    }

    function inheart(x, y, r) {
        var z = ((x / r) * (x / r) + (y / r) * (y / r) - 1) * ((x / r) * (x / r) + (y / r) * (y / r) - 1) * ((x / r) * (x / r) + (y / r) * (y / r) - 1) - (x / r) * (x / r) * (y / r) * (y / r) * (y / r);
        return z < 0;
    }

    Point = function(x, y) {
        this.x = x || 0;
        this.y = y || 0;
    }
    Point.prototype = {
        clone: function() { return new Point(this.x, this.y); },
        add: function(o) { var p = this.clone(); p.x += o.x; p.y += o.y; return p; },
        sub: function(o) { var p = this.clone(); p.x -= o.x; p.y -= o.y; return p; },
        div: function(n) { var p = this.clone(); p.x /= n; p.y /= n; return p; },
        mul: function(n) { var p = this.clone(); p.x *= n; p.y *= n; return p; }
    }

    Heart = function() {
        var points = [], x, y, t;
        for (var i = 0; i <= 2 * Math.PI + 0.1; i += 0.05) {
            t = i;
            x = 16 * Math.pow(Math.sin(t), 3);
            y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            points.push(new Point(x, y));
        }
        this.points = points;
        this.length = points.length;
    }
    Heart.prototype = {
        get: function(i, scale) { return this.points[i].mul(scale || 1); }
    }

    Seed = function(tree, point, scale, color) {
        this.tree = tree;
        var scale = scale || 1;
        var color = color || '#FF0000';
        this.heart = { point: point, scale: scale, color: color, figure: new Heart() };
        this.cirle = { point: point, scale: scale, color: color, radius: 5 };
    }
    Seed.prototype = {
        draw: function() { this.drawHeart(); this.drawText(); },
        addPosition: function(x, y) { this.cirle.point = this.cirle.point.add(new Point(x, y)); },
        canMove: function() { return this.cirle.point.y < (this.tree.height + 20); },
        move: function(x, y) { this.clear(); this.drawCirle(); this.addPosition(x, y); },
        canScale: function() { return this.heart.scale > 0.2; },
        setHeartScale: function(scale) { this.heart.scale *= scale; },
        scale: function(scale) { this.clear(); this.drawCirle(); this.drawHeart(); this.setHeartScale(scale); },
        drawHeart: function() {
            var ctx = this.tree.ctx, heart = this.heart;
            var point = heart.point, color = heart.color, scale = heart.scale;
            ctx.save();
            ctx.fillStyle = color;
            ctx.translate(point.x, point.y);
            ctx.beginPath();
            if (heart.figure.length > 0) {
                var first = heart.figure.get(0, scale);
                ctx.moveTo(first.x, -first.y);
            }
            for (var i = 1; i < heart.figure.length; i++) {
                var p = heart.figure.get(i, scale);
                ctx.lineTo(p.x, -p.y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        },
        drawCirle: function() {
            var ctx = this.tree.ctx, cirle = this.cirle;
            var point = cirle.point, color = cirle.color, scale = cirle.scale, radius = cirle.radius;
            ctx.save();
            ctx.fillStyle = color;
            ctx.translate(point.x, point.y);
            ctx.scale(scale, scale);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, radius, 0, 2 * Math.PI);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        },
        drawText: function() {},
        clear: function() {
            var ctx = this.tree.ctx, cirle = this.cirle;
            var point = cirle.point, scale = cirle.scale, radius = 26;
            var w = h = (radius * scale);
            ctx.clearRect(point.x - w, point.y - h, 4 * w, 4 * h);
        },
        hover: function(x, y) {
            var ctx = this.tree.ctx;
            var pixel = ctx.getImageData(x, y, 1, 1);
            return pixel.data[3] == 255;
        }
    }

    Footer = function(tree, width, height, speed) {
        this.tree = tree;
        this.point = new Point(tree.seed.heart.point.x, tree.height - height / 2);
        this.width = width;
        this.height = height;
        this.speed = speed || 2;
        this.length = 0;
    }
    Footer.prototype = {
        draw: function() {
            var ctx = this.tree.ctx, point = this.point;
            var len = this.length / 2;
            ctx.save();
            ctx.strokeStyle = '#4a2e1b';
            ctx.lineWidth = this.height;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.translate(point.x, point.y);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(len, 0);
            ctx.lineTo(-len, 0);
            ctx.stroke();
            ctx.restore();
            if (this.length < this.width) { this.length += this.speed; }
        }
    }

    Tree = function(canvas, width, height, opt) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.width = width;
        this.height = height;
        this.opt = opt || {};
        this.record = {};
        this.initSeed();
        this.initFooter();
        this.initBranch();
        this.initBloom();
    }
    Tree.prototype = {
        initSeed: function() {
            var seed = this.opt.seed || {};
            var x = seed.x || this.width / 2;
            var y = seed.y || this.height / 2;
            var point = new Point(x, y);
            var color = seed.color || '#FF0000';
            var scale = seed.scale || 1;
            this.seed = new Seed(this, point, scale, color);
        },
        initFooter: function() {
            var footer = this.opt.footer || {};
            var width = footer.width || this.width;
            var height = footer.height || 5;
            var speed = footer.speed || 2;
            this.footer = new Footer(this, width, height, speed);
        },
        initBranch: function() {
            var branchs = this.opt.branch || []
            this.branchs = [];
            if (branchs.length) this.addBranchs(branchs);
        },
        initBloom: function() {
            var bloom = this.opt.bloom || {};
            var cache = [],
                num = bloom.num || 500,
                width = bloom.width || this.width,
                height = bloom.height || this.height,
                figure = this.seed.heart.figure;
            var r = 240, x, y;
            for (var i = 0; i < num; i++) {
                cache.push(this.createBloom(width, height, r, figure));
            }
            this.blooms = [];
            this.bloomsCache = cache;
        },
        toDataURL: function(type) { return this.canvas.toDataURL(type); },
        draw: function(k) {
            var s = this, ctx = s.ctx;
            var rec = s.record[k];
            if (!rec) return;
            var point = rec.point, image = rec.image;
            ctx.save();
            ctx.putImageData(image, point.x, point.y);
            ctx.restore();
        },
        addBranch: function(branch) { this.branchs.push(branch); },
        addBranchs: function(branchs) {
            var s = this, b, p1, p2, p3, r, l, c;
            for (var i = 0; i < branchs.length; i++) {
                b = branchs[i];
                p1 = new Point(b[0], b[1]);
                p2 = new Point(b[2], b[3]);
                p3 = new Point(b[4], b[5]);
                r = b[6];
                l = b[7];
                c = b[8];
                s.addBranch(new Branch(s, p1, p2, p3, r, l, c));
            }
        },
        removeBranch: function(branch) {
            var branchs = this.branchs;
            for (var i = 0; i < branchs.length; i++) {
                if (branchs[i] === branch) { branchs.splice(i, 1); }
            }
        },
        canGrow: function() { return !!this.branchs.length; },
        grow: function() {
            var branchs = this.branchs;
            for (var i = 0; i < branchs.length; i++) {
                var branch = branchs[i];
                if (branch) { branch.grow(); }
            }
        },
        addBloom: function(bloom) { this.blooms.push(bloom); },
        removeBloom: function(bloom) {
            var blooms = this.blooms;
            for (var i = 0; i < blooms.length; i++) {
                if (blooms[i] === bloom) { blooms.splice(i, 1); }
            }
        },
        createBloom: function(width, height, radius, figure, color, alpha, angle, scale, place, speed) {
            var x, y;
            while (true) {
                x = random(20, width - 20);
                y = random(20, height - 20);
                if (inheart(x - width / 2, height - (height - 40) / 2 - y, radius)) {
                    return new Bloom(this, new Point(x, y), figure, color, alpha, angle, scale, place, speed);
                }
            }
        },
        canFlower: function() { return !!this.blooms.length; },
        flower: function(num) {
            var s = this, blooms = s.bloomsCache.splice(0, num);
            for (var i = 0; i < blooms.length; i++) { s.addBloom(blooms[i]); }
            blooms = s.blooms;
            for (var j = 0; j < blooms.length; j++) { blooms[j].flower(); }
        },
        snapshot: function(k, x, y, width, height) {
            var ctx = this.ctx;
            var image = ctx.getImageData(x, y, width, height);
            this.record[k] = { image: image, point: new Point(x, y), width: width, height: height };
        },
        setSpeed: function(k, speed) { this.record[k || "move"].speed = speed; },
        move: function(k, x, y) {
            var s = this, ctx = s.ctx;
            var rec = s.record[k || "move"];
            var point = rec.point, image = rec.image, speed = rec.speed || 10, width = rec.width, height = rec.height;
            i = point.x + speed < x ? point.x + speed : x;
            j = point.y + speed < y ? point.y + speed : y;
            ctx.save();
            ctx.clearRect(point.x, point.y, width, height);
            ctx.putImageData(image, i, j);
            ctx.restore();
            rec.point = new Point(i, j);
            rec.speed = speed * 0.95;
            if (rec.speed < 2) { rec.speed = 2; }
            return i < x || j < y;
        },
        jump: function() {
            var s = this, blooms = s.blooms;
            if (blooms.length) {
                for (var i = 0; i < blooms.length; i++) { blooms[i].jump(); }
            }
            if ((blooms.length && blooms.length < 3) || !blooms.length) {
                var bloom = this.opt.bloom || {},
                    width = bloom.width || this.width,
                    height = bloom.height || this.height,
                    figure = this.seed.heart.figure;
                var r = 240, x, y;
                for (var i = 0; i < random(1, 2); i++) {
                    blooms.push(this.createBloom(width / 2 + width, height, r, figure, null, 1, null, 1, new Point(random(-100, 600), 720), random(200, 300)));
                }
            }
        }
    }

    Branch = function(tree, point1, point2, point3, radius, length, branchs) {
        this.tree = tree;
        this.point1 = point1;
        this.point2 = point2;
        this.point3 = point3;
        this.radius = radius;
        this.length = length || 100;
        this.len = 0;
        this.t = 1 / (this.length - 1);
        this.branchs = branchs || [];
    }
    Branch.prototype = {
        grow: function() {
            var s = this, p;
            if (s.len <= s.length) {
                p = bezier([s.point1, s.point2, s.point3], s.len * s.t);
                s.draw(p);
                s.len += 1;
                s.radius *= 0.97;
            } else {
                s.tree.removeBranch(s);
                s.tree.addBranchs(s.branchs);
            }
        },
        draw: function(p) {
            var s = this;
            var ctx = s.tree.ctx;
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = '#5c3a21';
            ctx.shadowColor = '#4a2e1b';
            ctx.shadowBlur = 2;
            ctx.moveTo(p.x, p.y);
            ctx.arc(p.x, p.y, s.radius, 0, 2 * Math.PI);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    }

    Bloom = function(tree, point, figure, color, alpha, angle, scale, place, speed) {
        this.tree = tree;
        this.point = point;
        var pinks = ['#ff8b94', '#ffaaa5', '#ffc3a0', '#ffb3ba', '#ffdfba'];
        this.color = color || pinks[random(0, pinks.length - 1)];
        this.alpha = alpha || random(0.3, 1);
        this.angle = angle || random(0, 360);
        this.scale = scale || 0.1;
        this.place = place;
        this.speed = speed;
        this.figure = figure;
    }
    Bloom.prototype = {
        setFigure: function(figure) { this.figure = figure; },
        flower: function() {
            var s = this;
            s.draw();
            s.scale += 0.1;
            if (s.scale > 1) { s.tree.removeBloom(s); }
        },
        draw: function() {
            var s = this, ctx = s.tree.ctx, figure = s.figure;
            ctx.save();
            ctx.fillStyle = s.color;
            ctx.globalAlpha = s.alpha;
            ctx.translate(s.point.x, s.point.y);
            ctx.scale(s.scale, s.scale);
            ctx.rotate(s.angle);
            ctx.beginPath();
            if (figure.length > 0) {
                var first = figure.get(0);
                ctx.moveTo(first.x, -first.y);
            }
            for (var i = 1; i < figure.length; i++) {
                var p = figure.get(i);
                ctx.lineTo(p.x, -p.y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        },
        jump: function() {
            var s = this, height = s.tree.height;
            if (s.point.x < -20 || s.point.y > height + 20) {
                s.tree.removeBloom(s);
            } else {
                s.draw();
                s.point = s.place.sub(s.point).div(s.speed).add(s.point);
                s.angle += 0.05;
                s.speed -= 1;
            }
        }
    }

    window.random = random;
    window.bezier = bezier;
    window.Point = Point;
    window.Tree = Tree;

})(window);
</script>

<script>
(async function () {
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    const canvas = document.getElementById('treeCanvas');
    if (!canvas || !canvas.getContext) return;

    const width = 1100, height = 680;
    canvas.width = width;
    canvas.height = height;

    const opts = {
        seed: {
            x: width / 2 - 20,
            color: "#ff2a5f",
            scale: 2
        },
        branch: [
            [535, 680, 570, 250, 500, 200, 30, 100, [
                [540, 500, 455, 417, 340, 400, 13, 100, [
                    [450, 435, 434, 430, 394, 395, 2, 40]
                ]],
                [550, 445, 600, 356, 680, 345, 12, 100, [
                    [578, 400, 648, 409, 661, 426, 3, 80]
                ]],
                [539, 281, 537, 248, 534, 217, 3, 40],
                [546, 397, 413, 247, 328, 244, 9, 80, [
                    [427, 286, 383, 253, 371, 205, 2, 40],
                    [498, 345, 435, 315, 395, 330, 4, 60]
                ]],
                [546, 357, 608, 252, 678, 221, 6, 100, [
                    [590, 293, 646, 277, 648, 271, 2, 80]
                ]]
            ]]
        ],
        bloom: { num: 700, width: 1080, height: 650 },
        footer: { width: 1200, height: 5, speed: 10 }
    };

    const tree = new Tree(canvas, width, height, opts);
    const seed = tree.seed;
    const foot = tree.footer;

    seed.draw();
    await sleep(1400);
    while (seed.canScale()) { seed.scale(0.95); await sleep(10); }
    while (seed.canMove()) { seed.move(0, 2); foot.draw(); await sleep(10); }
    do { tree.grow(); await sleep(10); } while (tree.canGrow());
    do { tree.flower(2); await sleep(10); } while (tree.canFlower());

    canvas.style.backgroundImage = "url(" + canvas.toDataURL('image/png') + ")";
    canvas.style.backgroundSize = "100% 100%";

    const ctx = tree.ctx;
    const fig = tree.seed.heart.figure;
    const petals = [];
    const spawnPetal = function () {
        petals.push({
            x: width / 2 + (Math.random() - 0.5) * width * 0.82,
            y: -8,
            vx: (Math.random() - 0.5) * 1.2,
            vy: 1 + Math.random() * 1.6,
            rot: Math.random() * Math.PI * 2,
            vr: (Math.random() - 0.5) * 0.08,
            s: 0.45 + Math.random() * 0.75,
            a: 0.35 + Math.random() * 0.5,
            pink: Math.random() > 0.5
        });
    };

    while (true) {
        ctx.clearRect(0, 0, width, height);
        if (petals.length < 42 && Math.random() < 0.3) spawnPetal();

        for (let i = petals.length - 1; i >= 0; i--) {
            const p = petals[i];
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.vr;
            p.a *= 0.995;
            if (p.y > height + 24 || p.a < 0.04) petals.splice(i, 1);
        }

        for (const p of petals) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.pink ? '#ff8b94' : '#ffaaa5';
            ctx.globalAlpha = p.a;
            ctx.scale(p.s, p.s);
            ctx.beginPath();
            if (fig.length > 0) {
                const first = fig.get(0);
                ctx.moveTo(first.x, -first.y);
            }
            for (let i = 1; i < fig.length; i++) {
                const q = fig.get(i);
                ctx.lineTo(q.x, -q.y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        foot.draw();
        await sleep(30);
    }
})();
</script>
