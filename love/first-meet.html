<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Meet — Ayush & Sohani</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500;1,600&family=Jost:wght@300;400;500&display=swap');

  :root{
    --bg-deep: #0c0a1a;
    --bg-mid: #1a1230;
    --purple: #2a1f4d;
    --gold: #e0a458;
    --gold-soft: #f1c88a;
    --rose: #e08a7d;
    --ink: #efeaf6;
    --ink-dim: #9a92b8;
    --line: rgba(224,164,88,0.25);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background: radial-gradient(ellipse at 50% 0%, var(--bg-mid), var(--bg-deep) 70%);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    overflow-x:hidden;
  }

  #stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }

  /* Nav */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;
    background:rgba(12,10,26,0.85);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
  }
  .nav-logo{
    font-family:'Cormorant Garamond',serif;
    font-size:1.1rem;color:var(--gold-soft);
    text-decoration:none;
    display:flex;align-items:center;gap:7px;
  }
  .nav-heart{color:var(--rose);display:inline-block;animation:hb 1.6s ease infinite;}
  @keyframes hb{0%,100%{transform:scale(1)}14%{transform:scale(1.2)}28%{transform:scale(1)}}
  .nav-back{
    font-size:12px;color:var(--ink-dim);
    text-decoration:none;
    padding:7px 14px;
    border:1px solid var(--line);
    border-radius:100px;
    transition:color .2s,border-color .2s;
  }
  .nav-back:hover{color:var(--gold-soft);border-color:var(--gold);}

  .wrap{
    position:relative;
    z-index:1;
    max-width: 720px;
    margin: 0 auto;
    padding: 100px 24px 90px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .date-tag{
    font-family:'Jost',sans-serif;
    font-size:13px;
    letter-spacing:6px;
    color: var(--gold);
    opacity:0;
    animation: fadeUp .9s ease forwards;
  }

  .eyebrow{
    margin-top:10px;
    font-size:11px;
    letter-spacing:5px;
    color: var(--ink-dim);
    text-transform:uppercase;
    opacity:0;
    animation: fadeUp .9s ease forwards .15s;
  }

  h1.hero{
    margin-top: 34px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size: clamp(2.4rem, 7vw, 4.2rem);
    line-height:1.15;
    color: var(--ink);
    opacity:0;
    animation: fadeUp 1s ease forwards .3s;
  }

  h1.hero .name{
    display:block;
    margin-top:6px;
    font-weight:600;
    font-style:normal;
    background: linear-gradient(100deg, var(--rose), var(--gold-soft));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .sub{
    margin-top: 26px;
    max-width: 480px;
    font-size: 16px;
    line-height:1.85;
    color: var(--ink-dim);
    opacity:0;
    animation: fadeUp 1s ease forwards .5s;
  }

  .countdown-card{
    margin-top: 46px;
    width:100%;
    max-width: 440px;
    background: rgba(20,15,40,0.55);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px 20px 22px;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 60px rgba(224,164,88,0.06);
    opacity:0;
    animation: fadeUp 1s ease forwards .7s;
  }

  .countdown-label{
    font-size:11px;
    letter-spacing:4px;
    color: var(--ink-dim);
    text-transform:uppercase;
    margin-bottom: 18px;
  }

  .countdown-grid{
    display:flex;
    justify-content:space-between;
    gap: 8px;
  }

  .count-unit{ flex:1; }

  .count-num{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: clamp(1.7rem, 5vw, 2.4rem);
    background: linear-gradient(160deg, var(--gold-soft), var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    line-height:1;
  }

  .count-unit-label{
    margin-top:8px;
    font-size:10px;
    letter-spacing:2px;
    color: var(--ink-dim);
    text-transform:uppercase;
  }

  .photo-frame{
    margin-top: 50px;
    width: 100%;
    max-width: 320px;
    background: linear-gradient(160deg, rgba(224,164,88,0.14), rgba(18,14,36,0.6));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 16px 16px 26px;
    box-shadow: 0 0 70px rgba(224,164,88,0.10), 0 20px 50px rgba(0,0,0,0.4);
    opacity:0;
    animation: fadeUp 1s ease forwards 0.9s;
  }

  .photo-inner{
    width:100%;
    aspect-ratio: 4 / 5;
    border-radius: 14px;
    overflow:hidden;
    background: var(--purple);
  }

  .photo-inner img{
    width:100%;
    height:100%;
    object-fit: cover;
    display:block;
  }

  .photo-caption{
    margin-top: 14px;
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size: 20px;
    color: var(--gold-soft);
  }

  .heart{
    margin-top: 40px;
    font-size: 20px;
    color: var(--gold);
    animation: heartbeat 2.4s ease-in-out infinite;
  }

  .footer-meta{
    margin-top: 14px;
    font-size: 10px;
    letter-spacing:3px;
    color: var(--ink-dim);
    text-transform:uppercase;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes heartbeat{
    0%,100%{ transform: scale(1); }
    15%{ transform: scale(1.18); }
    30%{ transform: scale(1); }
    45%{ transform: scale(1.12); }
    60%{ transform: scale(1); }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="../love.html">
    Ayush <span class="nav-heart">&hearts;</span> Sohani
  </a>
  <a class="nav-back" href="../love.html">&larr; Back</a>
</nav>

<canvas id="stars"></canvas>

<div class="wrap">
  <div class="date-tag">21 . 08 . 2026</div>
  <div class="eyebrow">First Meet</div>

  <h1 class="hero">
    counting down to
    <span class="name">our first meet</span>
  </h1>

  <p class="sub">the day we finally meet face-to-face. every second brings us closer to 21 august.</p>

  <div class="countdown-card">
    <div class="countdown-label">Countdown to 21 August 2026</div>
    <div class="countdown-grid">
      <div class="count-unit">
        <div class="count-num" id="cd-days">00</div>
        <div class="count-unit-label">Days</div>
      </div>
      <div class="count-unit">
        <div class="count-num" id="cd-hours">00</div>
        <div class="count-unit-label">Hrs</div>
      </div>
      <div class="count-unit">
        <div class="count-num" id="cd-mins">00</div>
        <div class="count-unit-label">Min</div>
      </div>
      <div class="count-unit">
        <div class="count-num" id="cd-secs">00</div>
        <div class="count-unit-label">Sec</div>
      </div>
    </div>
  </div>

  <div class="photo-frame">
    <div class="photo-inner">
      <img src="images/sohani.png" alt="Sohani">
    </div>
    <div class="photo-caption">21 August 2026 &hearts;</div>
  </div>

  <div class="heart">&hearts;</div>
  <div class="footer-meta">21 August 2026 &middot; For Sohani</div>
</div>

<script>
  function getTargetDate(){
    return new Date(2026, 7, 21, 0, 0, 0); // 21 Aug 2026
  }

  const target = getTargetDate();

  function pad(n){ return n.toString().padStart(2,'0'); }

  function updateCountdown(){
    const now = new Date();
    let diff = target - now;
    if(diff < 0) diff = 0;

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const mins = Math.floor((diff / (1000*60)) % 60);
    const secs = Math.floor((diff / 1000) % 60);

    document.getElementById('cd-days').textContent = pad(days);
    document.getElementById('cd-hours').textContent = pad(hours);
    document.getElementById('cd-mins').textContent = pad(mins);
    document.getElementById('cd-secs').textContent = pad(secs);
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // Canvas background
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = document.body.scrollHeight;
  }

  function initStars(){
    stars = [];
    const count = Math.floor((canvas.width * canvas.height) / 9000);
    for(let i=0; i<count; i++){
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.3 + 0.3,
        alpha: Math.random() * 0.6 + 0.2,
        speed: Math.random() * 0.4 + 0.05,
        twinkleSpeed: Math.random() * 0.02 + 0.005,
        twinklePhase: Math.random() * Math.PI * 2
      });
    }
  }

  function drawStars(t){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    for(const s of stars){
      const tw = Math.sin(t * s.twinkleSpeed + s.twinklePhase) * 0.3 + 0.7;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = s.r > 1.1 ? `rgba(224,164,88,${(s.alpha*tw).toFixed(3)})` : `rgba(239,234,246,${(s.alpha*tw*0.7).toFixed(3)})`;
      ctx.fill();
    }
  }

  function animate(t){
    drawStars(t || 0);
    requestAnimationFrame(animate);
  }

  resize();
  initStars();
  animate(0);

  window.addEventListener('resize', () => {
    resize();
    initStars();
  });
</script>

</body>
</html>
