<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ayush â™¥ Sohani</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#07050f;
  --gold:#d4a44c;
  --gold2:#f0c46a;
  --rose:#e06878;
  --rose2:#f9b8c4;
  --ink:#f0ebff;
  --ink2:#9a92b8;
  --ink3:#4e4870;
  --glass:rgba(255,255,255,0.03);
  --border:rgba(255,255,255,0.07);
}
html,body{min-height:100%;overflow-x:hidden;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
}
#canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* â”€â”€ WRAP â”€â”€ */
.wrap{
  position:relative;z-index:1;
  max-width:560px;margin:0 auto;
  padding:80px 24px 70px;
}

/* â”€â”€ HEADER â”€â”€ */
.header{text-align:center;margin-bottom:48px;}
.header h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(1.5rem,4vw,2.2rem);
  font-weight:700;color:var(--ink);
  line-height:1.15;
}
.header h1 .heart{
  color:var(--rose);
  display:inline-block;
  animation:hb 1.6s ease infinite;
}
@keyframes hb{0%,100%{transform:scale(1)}14%{transform:scale(1.22)}28%{transform:scale(1)}}


/* â”€â”€ DIVIDER â”€â”€ */
.div{
  display:flex;align-items:center;gap:14px;
  margin-bottom:24px;
}
.div-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);}
.div-dot{width:4px;height:4px;border-radius:50%;background:rgba(212,164,76,0.4);}

/* â”€â”€ LIST â”€â”€ */
.list{display:flex;flex-direction:column;gap:8px;}

.item{
  display:flex;align-items:center;
  padding:12px 16px;
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:10px;
  text-decoration:none;
  transition:border-color .25s, background .25s, transform .25s;
  gap:12px;
}
.item:hover{
  border-color:rgba(212,164,76,0.28);
  background:rgba(212,164,76,0.05);
  transform:translateX(4px);
}
.item-icon{
  font-size:16px;
  width:32px;height:32px;min-width:32px;
  background:rgba(212,164,76,0.07);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(212,164,76,0.15);
}
.item-2 .item-icon{background:rgba(224,104,120,0.07);border-color:rgba(224,104,120,0.15);}
.item-body{flex:1;min-width:0;}
.item-name{
  font-size:13px;font-weight:500;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.item-meta{
  margin-top:2px;
  font-size:10px;color:var(--ink3);
  display:flex;gap:8px;align-items:center;
  flex-wrap:wrap;
}
.item-meta span{color:var(--ink3);}
.item-meta .dot{color:rgba(255,255,255,0.1);}
.item-arrow{
  font-size:14px;color:var(--ink3);
  transition:transform .25s, color .25s;
}
.item:hover .item-arrow{transform:translateX(3px);color:var(--gold);}

/* â”€â”€ FOOT â”€â”€ */
.foot{
  margin-top:50px;
  text-align:center;
  font-size:11px;color:var(--ink3);
  letter-spacing:2.5px;text-transform:uppercase;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="wrap">
  <div class="header">
    <h1>Ayush <span class="heart">♥</span> Sohani</h1>
  </div>

  <div class="div">
    <div class="div-line"></div>
    <div class="div-dot"></div>
    <div class="div-line"></div>
  </div>

  <div class="list">

    <a class="item item-1" href="love/girlfriends-day.html">
      <div class="item-icon">✨</div>
      <div class="item-body">
        <div class="item-name">Happy Girlfriend's Day</div>
        <div class="item-meta">
          <span>31 Jul 2026</span>
          <span class="dot">&middot;</span>
          <span>Girlfriend's Day</span>
        </div>
      </div>
      <div class="item-arrow">&rsaquo;</div>
    </a>

    <a class="item item-2" href="love/gallery.html">
      <div class="item-icon">📸</div>
      <div class="item-body">
        <div class="item-name">Gallery</div>
        <div class="item-meta">
          <span>Always growing</span>
          <span class="dot">&middot;</span>
          <span>Photos & Videos</span>
        </div>
      </div>
      <div class="item-arrow">&rsaquo;</div>
    </a>

  </div>

  <div class="foot">made with love &middot; by ayush</div>
</div>

<script>
/* subtle star canvas */
(function(){
  const c=document.getElementById('canvas'),ctx=c.getContext('2d');
  let W,H,s=[];
  function r(){W=c.width=innerWidth;H=c.height=innerHeight;}
  function mk(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*.9+.2,o:Math.random(),v:Math.random()*.3+.04};}
  r();s=Array.from({length:100},mk);
  window.addEventListener('resize',r);
  (function dr(){
    ctx.clearRect(0,0,W,H);
    s.forEach(p=>{
      p.o+=p.v*.012;
      const a=Math.abs(Math.sin(p.o*Math.PI))*.45;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(212,164,76,${a})`;ctx.fill();
    });
    requestAnimationFrame(dr);
  })();
})();
</script>
</body>
</html>
