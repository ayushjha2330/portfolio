<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ayush &hearts; Sohani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#07050e;
  --bg-card:rgba(255,255,255,0.025);
  --bg-card-hover:rgba(212,164,76,0.04);
  --gold:#d4a44c;
  --gold-soft:#f0c46a;
  --rose:#e06878;
  --rose-soft:#f9b8c4;
  --ink:#f4f0fa;
  --ink-muted:#9e97b8;
  --ink-dim:#5a547a;
  --border:rgba(255,255,255,0.08);
  --border-hover:rgba(212,164,76,0.3);
}
html,body{min-height:100%;overflow-x:hidden;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Plus Jakarta Sans',sans-serif;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
#canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* Ambient Orbs */
.bg-orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;}
.orb-1{width:450px;height:450px;top:-100px;left:-100px;background:radial-gradient(circle,rgba(224,104,120,0.08),transparent 70%);}
.orb-2{width:450px;height:450px;bottom:-100px;right:-100px;background:radial-gradient(circle,rgba(212,164,76,0.07),transparent 70%);}

/* Wrapper */
.wrap{
  position:relative;z-index:1;
  width:100%;max-width:520px;
  padding:60px 20px;
  margin:0 auto;
}

/* Header */
.header{text-align:center;margin-bottom:36px;}
.header h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2rem,6vw,2.8rem);
  font-weight:600;
  letter-spacing:-0.5px;
  color:var(--ink);
  line-height:1.1;
}
.header h1 .heart{
  color:var(--rose);
  display:inline-block;
  font-style:normal;
  margin:0 4px;
  animation:hb 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.15)}}

.header-tag{
  display:inline-block;
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:10px;
  opacity:0.85;
}

/* Divider */
.divider{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin-bottom:28px;
}
.div-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);}
.div-diamond{width:5px;height:5px;transform:rotate(45deg);background:var(--gold);opacity:0.5;}

/* List */
.list{display:flex;flex-direction:column;gap:12px;}

.item{
  position:relative;
  display:flex;align-items:center;
  padding:14px 18px;
  background:var(--bg-card);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:12px;
  text-decoration:none;
  transition:all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  gap:14px;
}
.item:hover{
  border-color:var(--border-hover);
  background:var(--bg-card-hover);
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(0,0,0,0.3), 0 0 20px rgba(212,164,76,0.06);
}

.item-num{
  font-family:'Cormorant Garamond',serif;
  font-size:15px;
  font-weight:600;
  color:var(--gold-soft);
  width:34px;height:34px;min-width:34px;
  background:rgba(212,164,76,0.06);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(212,164,76,0.18);
  transition:all 0.28s ease;
}
.item:hover .item-num{
  background:rgba(212,164,76,0.14);
  border-color:rgba(212,164,76,0.35);
  color:#fff;
}

.item-body{flex:1;min-width:0;}
.item-name{
  font-size:14px;
  font-weight:500;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:-0.1px;
}
.item-meta{
  margin-top:3px;
  font-size:11px;
  color:var(--ink-muted);
  display:flex;
  gap:8px;
  align-items:center;
}
.item-meta .dot{color:var(--ink-dim);}

.item-arrow{
  width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-dim);
  transition:all 0.28s ease;
}
.item-arrow svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
.item:hover .item-arrow{
  color:var(--gold-soft);
  transform:translateX(3px);
}

/* Footer */
.foot{
  margin-top:40px;
  text-align:center;
  font-size:10px;
  color:var(--ink-dim);
  letter-spacing:2.5px;
  text-transform:uppercase;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>

<div class="wrap">
  <div class="header">
    <span class="header-tag">Personal Archive</span>
    <h1>Ayush <span class="heart">&hearts;</span> Sohani</h1>
  </div>

  <div class="divider">
    <div class="div-line"></div>
    <div class="div-diamond"></div>
    <div class="div-line"></div>
  </div>

  <div class="list">

    <a class="item" href="love/girlfriends-day.html">
      <div class="item-num">01</div>
      <div class="item-body">
        <div class="item-name">Happy Girlfriend's Day</div>
        <div class="item-meta">
          <span>31 Jul 2026</span>
          <span class="dot">&middot;</span>
          <span>Girlfriend's Day</span>
        </div>
      </div>
      <div class="item-arrow">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </div>
    </a>

    <a class="item" href="love/gallery.html">
      <div class="item-num">02</div>
      <div class="item-body">
        <div class="item-name">Gallery</div>
        <div class="item-meta">
          <span>Always growing</span>
          <span class="dot">&middot;</span>
          <span>Photos &amp; Videos</span>
        </div>
      </div>
      <div class="item-arrow">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </div>
    </a>

  </div>

  <div class="foot">made with love &middot; by ayush</div>
</div>

<script>
/* Subtle particle canvas */
(function(){
  const c=document.getElementById('canvas'),ctx=c.getContext('2d');
  let W,H,s=[];
  function r(){W=c.width=innerWidth;H=c.height=innerHeight;}
  function mk(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*.8+.2,o:Math.random(),v:Math.random()*.3+.04};}
  r();s=Array.from({length:90},mk);
  window.addEventListener('resize',r);
  (function dr(){
    ctx.clearRect(0,0,W,H);
    s.forEach(p=>{
      p.o+=p.v*.012;
      const a=Math.abs(Math.sin(p.o*Math.PI))*.4;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(212,164,76,${a})`;ctx.fill();
    });
    requestAnimationFrame(dr);
  })();
})();
</script>
</body>
</html>
