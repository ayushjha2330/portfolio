<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ayush ♥ Sohani — Everything for You</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg-deep:#0c0a1a;
    --bg-mid:#1a1230;
    --gold:#e0a458;
    --gold-soft:#f1c88a;
    --rose:#e08a7d;
    --ink:#efeaf6;
    --ink-dim:#9a92b8;
    --line:rgba(224,164,88,0.25);
  }
  html,body{
    min-height:100%;
    background:radial-gradient(ellipse at 50% 0%, var(--bg-mid), var(--bg-deep) 70%);
    color:var(--ink);
    font-family:'Segoe UI', system-ui, sans-serif;
  }
  .wrap{
    max-width:680px;
    margin:0 auto;
    padding:70px 24px 90px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:5px;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:12px;
  }
  h1{
    font-size:clamp(2rem,6vw,3.2rem);
    font-weight:600;
    line-height:1.15;
    color:var(--gold-soft);
  }
  h1 .heart{ color:var(--rose); }
  .sub{
    margin-top:14px;
    color:var(--ink-dim);
    font-size:15px;
    line-height:1.6;
  }
  .list{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .item{
    display:block;
    padding:20px 22px;
    border:1px solid var(--line);
    border-radius:14px;
    text-decoration:none;
    background:rgba(255,255,255,0.02);
    transition:border-color .25s, transform .25s, background .25s;
  }
  .item:hover{
    border-color:var(--gold);
    background:rgba(224,164,88,0.08);
    transform:translateY(-2px);
  }
  .item .num{
    font-size:11px;
    letter-spacing:3px;
    color:var(--gold);
    text-transform:uppercase;
  }
  .item h2{
    margin-top:8px;
    font-size:19px;
    font-weight:600;
    color:var(--ink);
  }
  .item .date{
    margin-top:8px;
    font-size:13px;
    color:var(--rose);
  }
  .foot{
    margin-top:40px;
    text-align:center;
    font-size:12px;
    color:var(--ink-dim);
    letter-spacing:2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">A collection made with love</div>
  <h1>Ayush <span class="heart">♥</span> Sohani</h1>
  <p class="sub">Everything I've made for you, all in one place. Every time I make something new, I'll add it here.</p>

  <div class="list">
    <a class="item" href="love/1.html">
      <div class="num">For You #1</div>
      <h2>Happy Girlfriend's Day, Sohani</h2>
      <p class="date">Created: 31 Jul 2026 — made for Girlfriend's Day (Aug 1)</p>
    </a>
  </div>

  <div class="foot">made with love by ayush</div>
</div>
</body>
</html>
